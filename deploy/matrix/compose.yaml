services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:17}
    restart: unless-stopped
    environment:
      POSTGRES_USER: synapse
      POSTGRES_DB: synapse
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a unique database password}
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale=C
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U synapse -d synapse']
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [internal]
  synapse:
    image: ${SYNAPSE_IMAGE:-matrixdotorg/synapse:v1.164.1}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      UID: ${SYNAPSE_UID:-991}
      GID: ${SYNAPSE_GID:-991}
    volumes:
      - ${SYNAPSE_DATA:-./data}:/data
    networks: [internal, edge]
  caddy:
    image: ${CADDY_IMAGE:-caddy:2}
    restart: unless-stopped
    environment:
      MATRIX_HOST: ${MATRIX_HOST:?Set your homeserver DNS name}
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [edge]
networks:
  internal:
    internal: true
  edge:
volumes:
  postgres:
  caddy_data:
  caddy_config:
